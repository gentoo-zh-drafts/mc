
name: Create golang vendor dist
on:
  push:
    tags:
      - '**'

jobs:
  golang-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create golang dist
        uses: projg2/golang-dist-action@v1
        with:
          dist-filename: mc-RELEASE.2025-08-13T08-35-41Z
          vendor-dir: mc-RELEASE.2025-08-13T08-35-41Z

